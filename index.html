<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scribe — документи</title><meta name="description" content="Політика конфіденційності та умови використання застосунку Scribe.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBFBFA;--card:#fff;--border:#ECECE9;--text:#151515;--muted:#6B6B6B;--link:#6D3FD9;
--grad:linear-gradient(100deg,#D9468F,#8B5CF6 30%,#2F7FEA 60%,#0EA5A0)}
@media (prefers-color-scheme:dark){:root{--bg:#0E0E0F;--card:#151517;--border:#242428;--text:#EDEDED;--muted:#8C8C92;--link:#EBC777;
--grad:linear-gradient(100deg,#D4A94C,#EBC777 40%,#FFF5DA 55%,#D4A94C)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.65 Mulish,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:720px;margin:0 auto;padding:40px 16px 80px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;text-decoration:none;color:var(--text)}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--grad);display:block}
nav.lang{display:flex;gap:8px;margin:28px 0 8px}
nav.lang a{font-weight:800;font-size:14px;text-decoration:none;color:var(--text);border:1px solid var(--border);background:var(--card);border-radius:999px;padding:7px 14px}
h1{font-size:32px;line-height:1.2;font-weight:900;margin:36px 0 6px}
h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.upd{color:var(--muted);font-size:15px;margin:0 0 8px}
h2{font-size:21px;line-height:1.3;font-weight:800;margin:34px 0 8px}
p,li{margin:0 0 14px}
a{color:var(--link);text-decoration-thickness:1px;text-underline-offset:3px;word-break:break-word}
hr{border:0;border-top:1px solid var(--border);margin:56px 0 0}
.cards{display:grid;gap:12px;margin-top:28px}
.cards a{display:block;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:18px;text-decoration:none;color:var(--text)}
.cards b{display:block;font-size:18px}.cards span{color:var(--muted);font-size:15px}
footer{color:var(--muted);font-size:14px;margin-top:56px}
</style></head><body><main>
<a class="brand" href="./"><i></i>Scribe</a>
<h1>Scribe — <span>документи</span></h1><p class="upd">Щоденник англійської з перевіркою помилок.</p>
<div class="cards"><a href="privacy/"><b>Політика конфіденційності</b><span>Privacy Policy</span></a>
<a href="terms/"><b>Умови використання</b><span>Terms of Use · підтримка й контакти</span></a>
<a href="https://apps.apple.com/app/id6828376410"><b>Scribe в App Store</b><span>iPhone</span></a></div>
<footer>Scribe · <a href="privacy/">Політика конфіденційності</a> · <a href="terms/">Умови використання</a></footer>
</main></body></html>
